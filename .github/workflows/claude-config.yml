name: Claude config checks

on:
  pull_request:
    paths:
      - ".claude/**"
      - "CLAUDE.md"
      - ".github/workflows/claude-config.yml"
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - "CLAUDE.md"
      - ".github/workflows/claude-config.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate settings JSON
        run: python -m json.tool .claude/settings.json >/dev/null
      - name: Validate shell hooks and scripts
        run: |
          find .claude/hooks .claude/scripts -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r -n1 sh -n
      - name: Validate skill frontmatter
        run: |
          set -eu
          for f in .claude/skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            head -n 1 "$f" | grep -qx -- '---'
            grep -q '^name:' "$f"
            grep -q '^description:' "$f"
          done
      - name: Enforce permanent context budget
        run: |
          set -eu
          bytes=$(wc -c < CLAUDE.md)
          lines=$(wc -l < CLAUDE.md)
          [ "$bytes" -le 6000 ] || { echo "CLAUDE.md too large: $bytes bytes (budget 6000)"; exit 1; }
          [ "$lines" -le 80 ] || { echo "CLAUDE.md too long: $lines lines (budget 80)"; exit 1; }
          skills=$(find .claude/skills -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          [ "$skills" -le 30 ] || { echo "too many project skills: $skills (budget 30)"; exit 1; }
          for hook in .claude/hooks/*.sh; do
            [ -f "$hook" ] || continue
            size=$(wc -c < "$hook")
            [ "$size" -le 5000 ] || { echo "hook too large: $hook ($size bytes)"; exit 1; }
          done
