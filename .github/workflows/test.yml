name: KODOKU tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Avoid fetching build dependencies with setup-python's potentially stale
      # bundled pip CA trust store. The upstream-published SHA-256 pins the
      # bootstrap wheel even if an HTTPS connection is intercepted.
      - name: Bootstrap patched pip with SHA-256 verification
        run: |
          python -m pip install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -c "import pip; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2), pip.__version__"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q src
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Smoke demo
        run: kodoku-demo >/dev/null
