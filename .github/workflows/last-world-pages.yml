name: Publish LAST WORLD

on:
  push:
    branches: [main]
    paths:
      - "experiments/last-world/**"
      - ".github/workflows/last-world-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload LAST WORLD
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/last-world
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
