<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>LAST WORLD</title>
<style>
:root{--bg:#07090d;--fg:#f4f2ea;--muted:#969aa4;--line:rgba(255,255,255,.11);--glass:rgba(255,255,255,.055);--hot:#f3c969}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 52% 48%,rgba(255,255,255,.035),transparent 34%),radial-gradient(circle at 80% 10%,rgba(243,201,105,.05),transparent 28%);pointer-events:none}main{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));gap:14px;max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.24em;font-weight:760}.counter{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.arena{position:relative;display:grid;place-items:center;min-height:0}.ring{width:min(78vw,430px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center}.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;inset:8%;border:1px solid var(--line)}.ring:after{inset:24%;border-color:rgba(255,255,255,.07)}canvas{position:absolute;inset:0;width:100%;height:100%}.world{z-index:2;text-align:center;width:70%;display:flex;flex-direction:column;align-items:center;gap:10px}.era{font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.12em}.world h1{font-size:clamp(34px,9vw,58px);line-height:.91;letter-spacing:-.065em;margin:0;max-width:9ch;text-wrap:balance}.world p{margin:0;color:#b8bbc2;max-width:29ch;font-size:13px;line-height:1.45;text-wrap:balance}.traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.trait{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}.footer{display:grid;grid-template-columns:1fr auto;gap:10px}button{appearance:none;border:0;border-radius:18px;min-height:58px;font-weight:780;font-size:15px;cursor:pointer}#spawn{background:var(--fg);color:#0a0b0f}#spawn:active{transform:scale(.985)}#archive{width:58px;background:var(--glass);color:var(--fg);border:1px solid var(--line);font-size:18px}.notice{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);opacity:0;background:#f4f2ea;color:#0d0e12;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:750;transition:.25s;pointer-events:none;white-space:nowrap}.notice.show{opacity:1;transform:translate(-50%,0)}.grave{position:fixed;inset:0;background:rgba(5,6,9,.93);backdrop-filter:blur(16px);z-index:20;display:none;padding:24px;overflow:auto}.grave.open{display:block}.sheet{max-width:680px;margin:auto;padding-top:20px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.sheet h2{margin:0;font-size:28px;letter-spacing:-.04em}.close{border:1px solid var(--line);background:var(--glass);color:white;min-height:42px;width:42px;border-radius:14px}.dead{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.dead b{font-size:15px}.dead small{color:var(--muted);font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{color:var(--muted);font-size:13px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><div class="brand">LAST WORLD</div><div class="counter" id="counter">WORLD 001 · SURVIVORS 1</div></header><section class="arena"><div class="ring"><canvas id="c"></canvas><div class="world"><div class="era" id="era">GENESIS // STABLE</div><h1 id="name">静かな海の世界</h1><p id="desc">文明は海面のわずかな振動だけで通信する。大声という概念が存在しない。</p><div class="traits" id="traits"></div></div></div></section><div class="footer"><button id="spawn">別の世界を発生させる</button><button id="archive" aria-label="墓地">†</button></div></main><div class="notice" id="notice"></div><section class="grave" id="grave"><div class="sheet"><div class="sheettop"><h2>滅びた世界</h2><button class="close" id="close">×</button></div><div id="deadlist" class="empty">まだ誰も滅びていない。</div></div></section>
<script>
const A=["海","塔","森","砂","月","雨","骨","雲","影","鏡","穴","庭","雪","雷","灰","星","眠り","匂い","声","光"],B=["が眠らない","だけが嘘をつく","が記憶を持つ","を食べる","が逆に落ちる","しか見えない","が年を取る","が増殖する","が裁判する","が神を無視する","に名前がない","が毎晩移動する"],D=["住民は生まれた日に一生分の夢を見て、それ以後は眠らない。","すべての建物が一枚の薄い膜でできており、風向きで都市の形が変わる。","記憶は個人ではなく街路に保存され、引っ越すと別人の人生を思い出す。","貨幣の代わりに『まだ起きていない偶然』が売買されている。","文明は巨大生物の背中に築かれているが、その生物は住民の存在に気づいていない。","夜になると物理法則が一つだけ消え、朝には別の法則が戻ってくる。","言語には過去形しかなく、未来について話すには歌う必要がある。","死んだ都市は撤去されず、新しい都市がその内部に何層も建てられている。","住民は鏡像のほうを本体だと信じており、現実側を『残像』と呼んでいる。","海が地図を読み、人間より先に国境の変化を知る。"],T=["高適応","低騒音","記憶共有","群体","非直線時間","巨大構造","儀式経済","移動都市","盲点進化","夢通信","対称破壊","遅延知性"];
let n=1,current={name:"静かな海の世界",score:58,gen:1,traits:["低騒音","夢通信"],desc:document.querySelector("#desc").textContent},dead=[];const $=s=>document.querySelector(s),rand=a=>a[Math.floor(Math.random()*a.length)];
function make(){const name=rand(A)+rand(B)+"世界",traits=[rand(T),rand(T)].filter((v,i,a)=>a.indexOf(v)==i);let score=Math.floor(24+Math.random()*73);if(traits.includes("高適応"))score+=8;return{name,desc:rand(D),traits,score:Math.min(99,score),gen:n+1}}
function render(w){$("#name").textContent=w.name;$("#desc").textContent=w.desc;$("#traits").innerHTML=w.traits.map(t=>'<span class="trait">'+t+"</span>").join("");$("#era").textContent="GEN "+String(w.gen).padStart(3,"0")+" // FITNESS "+w.score;$("#counter").textContent="WORLD "+String(n).padStart(3,"0")+" · SURVIVORS 1"}
function toast(s){let e=$("#notice");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)}
$("#spawn").onclick=()=>{n++;const challenger=make(),upset=Math.random()<.18;if(challenger.score>current.score||upset){dead.unshift({...current,cause:upset?"突然変異に敗北":"適応度不足"});current=challenger;toast("新世界が旧世界を捕食した")}else{dead.unshift({...challenger,cause:"適応度不足"});toast("新世界は定着できなかった")}current.gen=n;render(current);burst();if(dead.length>24)dead.length=24};
$("#archive").onclick=()=>{$("#grave").classList.add("open");$("#deadlist").className=dead.length?"":"empty";$("#deadlist").innerHTML=dead.length?dead.map(x=>'<div class="dead"><div><b>'+x.name+'</b><br><small>'+x.traits.join(" · ")+'</small></div><small>'+x.cause+"</small></div>").join(""):"まだ誰も滅びていない。"};$("#close").onclick=()=>$("#grave").classList.remove("open");
const c=$("#c"),ctx=c.getContext("2d");let motes=[];function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}function burst(){const r=c.getBoundingClientRect();for(let i=0;i<30;i++)motes.push({x:r.width/2,y:r.height/2,a:Math.random()*6.28,v:1+Math.random()*2.6,l:1})}function tick(){const r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);motes.forEach(p=>{p.x+=Math.cos(p.a)*p.v;p.y+=Math.sin(p.a)*p.v;p.v*=.985;p.l-=.018;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle="#f3c969";ctx.beginPath();ctx.arc(p.x,p.y,1.1,0,7);ctx.fill()});motes=motes.filter(p=>p.l>0);ctx.globalAlpha=1;requestAnimationFrame(tick)}addEventListener("resize",resize);resize();tick();render(current);
</script></body></html>
